name: alcyone_mobile
description: "Alcyone - a native-feeling Android shell for Multica."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.2.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  flutter_launcher_icons: ^0.14.4
  webview_flutter_platform_interface: ^2.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Launcher icon generation. Run `flutter pub run flutter_launcher_icons`
# after regenerating assets/icon/alcyone_icon.png.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/alcyone_icon.png"
  adaptive_icon_background: "#05070D"
  adaptive_icon_foreground: "assets/icon/alcyone_icon_foreground.png"
  min_sdk_android: 23
  remove_alpha_ios: true

